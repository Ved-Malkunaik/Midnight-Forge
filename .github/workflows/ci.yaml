name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Compact Compiler
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Update NPM
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Compile and test contract
        working-directory: contract
        run: |
          npm test

      - name: Compile and test API
        working-directory: api
        run: |
          npm run build

      - name: Typecheck and build frontend
        working-directory: midnight-forge-ui
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
          node ../node_modules/vite/bin/vite.js build --mode preprod
